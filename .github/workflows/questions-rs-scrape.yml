name: Questions RS scrape and publish

# Rajya Sabha questions scraper. 12×/day cron at :33 every 2 hours.
# Wraps _questions_core.py via build_questions_rs.py — writes to
# docs/questions-rs/.
#
# Initial backfill: dispatch manually with `rs_sessions: all` once.

on:
  schedule:
    - cron: '33 */2 * * *'
  workflow_dispatch:
    inputs:
      rs_sessions:
        description: 'RS sessions to walk: "all" | "<csv>" | "" (default = recent-2)'
        default: ''
      max_rs_extractions:
        description: 'Max RS bundles to extract this run'
        default: '25'
      max_run_seconds:
        description: 'Hard wall-clock cap (seconds)'
        default: '1500'

permissions:
  contents: write

concurrency:
  group: proceedings-data-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build questions-rs primary data (extract phase only)
        env:
          BUILD_PHASE:                'extract'
          RS_SESSIONS:                ${{ inputs.rs_sessions        || '' }}
          MAX_RS_EXTRACTIONS_PER_RUN: ${{ inputs.max_rs_extractions || '25' }}
          MAX_RUN_SECONDS:            ${{ inputs.max_run_seconds    || '1500' }}
          EXTRACT_WORKERS:            '4'
          JITTER_MIN_MS:              '250'
          JITTER_MAX_MS:              '500'
        run: python build_questions_rs.py

      - name: Commit and push primary changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/questions-rs/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update questions-rs primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          # Robust push: rebase onto latest main (prefer our freshly-built files), retry on races
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then echo "pushed on attempt $attempt"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push attempt $attempt failed (race); retrying"; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
