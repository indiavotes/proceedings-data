name: Debates RS derive (manifest + bundle + index + meta)

# Builds docs/debates-rs/{manifest,audit,meta}.json + sharded text bundles +
# sharded search index. Triggered by RS scrape (workflow_run) and a 30-min
# cron backstop.

on:
  workflow_run:
    workflows:
      - "Debates RS scrape and publish"
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proceedings-data-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build derived files (manifest + bundle + index + meta)
        env:
          BUILD_PHASE: 'derive'
        run: python build_debates_rs.py

      - name: Commit and push derived changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/debates-rs/
          git diff --cached --quiet && echo "no derived changes" && exit 0
          git commit -m "Auto-rebuild debates-rs derived files [$(date -u +%Y-%m-%dT%H:%MZ)]"
          # Robust push: rebase onto latest main (prefer our freshly-built files), retry on races
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then echo "pushed on attempt $attempt"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push attempt $attempt failed (race); retrying"; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
